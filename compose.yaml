services:
  app:
    build: .
    env_file: .env
    environment:
      JISR_HOST: 0.0.0.0
      JISR_PORT: 8766
      JISR_DATA_DIR: /app/data
      JISR_TRUST_PROXY: "1"
    volumes:
      - jisr_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    expose:
      - "8766"

  caddy:
    image: caddy:2.11.4
    environment:
      JISR_DOMAIN: "${JISR_DOMAIN:?set JISR_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jisr_data:
  caddy_data:
  caddy_config:
