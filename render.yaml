# Always-on hackathon configuration. Review billing before creating the service.
# Compute: $25/month; 10 GB disk: $2.50/month, plus AI and excess usage.
services:
  - type: web
    name: jisr-hackathon
    runtime: docker
    plan: 1c-2g
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1
    # A disk requires a brief stop during deployment. Keep judging uninterrupted.
    autoDeployTrigger: "off"
    disk:
      name: jisr-data
      mountPath: /app/data
      sizeGB: 10
    envVars:
      - key: JISR_HOST
        value: 0.0.0.0
      - key: JISR_PORT
        value: "10000"
      - key: JISR_DATA_DIR
        value: /app/data
      - key: JISR_TRUST_PROXY
        value: render
      - key: JISR_MAX_UPLOAD_MB
        value: "250"
      - key: JISR_FFMPEG_THREADS
        value: "2"
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
