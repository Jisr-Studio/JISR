# Free demo hosting. Uploads and SQLite data are temporary and lost on restart.
# Sleeps after 15 minutes idle. External AI services retain their own charges.
services:
  - type: web
    name: jisr-hackathon
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1
    autoDeployTrigger: "off"
    envVars:
      - key: JISR_HOST
        value: 0.0.0.0
      - key: JISR_PORT
        value: "10000"
      - key: JISR_DATA_DIR
        value: /app/data
      - key: JISR_TRUST_PROXY
        value: render
      - key: JISR_MAX_UPLOAD_MB
        value: "250"
      - key: JISR_FFMPEG_THREADS
        value: "1"
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
